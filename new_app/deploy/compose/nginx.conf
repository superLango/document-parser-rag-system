server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 容器重建后 api-gateway 的 IP 会变化，使用 Docker DNS 动态解析，
    # 避免 nginx 在启动时缓存旧 IP 导致 502。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 一站式解析对外契约：/api/v1/integration/... 保持与旧系统一致。
    location /api/ {
        set $gateway api-gateway:8000;
        proxy_pass http://$gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        client_max_body_size 120m;
    }

    # LIMS 用跨域 iframe 嵌入结果页；原文 PDF 的 X-Frame-Options: SAMEORIGIN 会被浏览器
    # 按整条嵌套链校验而拦截。这里放开为与页面本身一致的“允许任意上层内嵌”。
    location ~ ^/v1/documents/[^/]+/file$ {
        set $gateway api-gateway:8000;
        proxy_pass http://$gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_hide_header X-Frame-Options;
        add_header Content-Security-Policy "frame-ancestors *" always;
    }

    # SSE + upload/download proxy to the gateway.
    location /v1/ {
        set $gateway api-gateway:8000;
        proxy_pass http://$gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        client_max_body_size 120m;
    }

    # 带内容哈希的构建产物可长缓存；index.html 等入口必须每次重新校验。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
