name: hanson-new-app

x-app: &app
  build:
    context: ../..
    dockerfile: deploy/compose/Dockerfile
  image: hanson-new-app:local
  restart: unless-stopped
  environment:
    DATABASE_URL: ${DATABASE_URL:-postgresql://hanson:hanson@postgres:5432/hanson}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
    OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-hanson-docs}
    OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
    OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
    AGENT_BASE_URL_PRIMARY: ${AGENT_BASE_URL_PRIMARY:-http://39.107.239.208:35035}
    AGENT_BASE_URL_SECONDARY: ${AGENT_BASE_URL_SECONDARY:-http://192.168.188.75:9991}
    AGENT_BASE_URL_TERTIARY: ${AGENT_BASE_URL_TERTIARY:-http://192.168.1.35:9988}
    AGENT_FAILOVER_SECONDS: ${AGENT_FAILOVER_SECONDS:-10}
    AGENT_FAILOVER_COOLDOWN: ${AGENT_FAILOVER_COOLDOWN:-30}
    AGENT_MODEL: ${AGENT_MODEL:-Qwen3.6-35B-A3B-NVFP4}
    AGENT_CONTEXT_WINDOW: ${AGENT_CONTEXT_WINDOW:-65536}
    AGENT_MAX_OUTPUT_TOKENS: ${AGENT_MAX_OUTPUT_TOKENS:-4096}
    AGENT_TOKENIZER_MODE: ${AGENT_TOKENIZER_MODE:-remote}
    AGENT_SESSION_DB: ${AGENT_SESSION_DB:-/tmp/hanson-agent/sessions.db}
    REVIEW_URL: ${REVIEW_URL:-http://review:8006}
    REVIEW_AGENT_URL: ${REVIEW_AGENT_URL:-http://agent:8003}
    REVIEW_USE_AGENT: ${REVIEW_USE_AGENT:-true}
    AGENT_URL: ${AGENT_URL:-http://agent:8003}
    FEEDBACK_TIMEOUT_SECONDS: ${FEEDBACK_TIMEOUT_SECONDS:-300}
    ORCHESTRATION_URL: ${ORCHESTRATION_URL:-http://orchestration:8001}
    MOCK_STAGE_DELAY_SECONDS: ${MOCK_STAGE_DELAY_SECONDS:-0.2}
    STAGE_MAX_ATTEMPTS: ${STAGE_MAX_ATTEMPTS:-2}
    STAGE_RETRY_BACKOFF_SECONDS: ${STAGE_RETRY_BACKOFF_SECONDS:-0.5}
    MOCK_FAIL_STAGE: ${MOCK_FAIL_STAGE:-}
    MOCK_FAIL_TIMES: ${MOCK_FAIL_TIMES:-0}
    OCR_URL: ${OCR_URL:-http://ocr:8002}
    OCR_BACKEND: ${OCR_BACKEND:-auto}
    OCR_DPI: ${OCR_DPI:-150}
    OCR_USE_FAKE: ${OCR_USE_FAKE:-false}
    GLM_OCR_BASE_URL: ${GLM_OCR_BASE_URL:-http://192.168.1.35:9977/v1}
    GLM_OCR_MODEL: ${GLM_OCR_MODEL:-GLM-OCR}
    GLM_OCR_TIMEOUT_SECONDS: ${GLM_OCR_TIMEOUT_SECONDS:-180}
    LAYOUT_BASE_URL: ${LAYOUT_BASE_URL:-http://192.168.1.35:9978}
    LAYOUT_TIMEOUT_SECONDS: ${LAYOUT_TIMEOUT_SECONDS:-60}
    RECIPE_REGISTRY_URL: ${RECIPE_REGISTRY_URL:-http://recipe-registry:8005}
    ROUTE_USE_FAKE: ${ROUTE_USE_FAKE:-false}
    SANDBOX_URL: ${SANDBOX_URL:-http://sandbox:8004}
    SANDBOX_USE_FAKE: ${SANDBOX_USE_FAKE:-false}
    SANDBOX_EXECUTOR: ${SANDBOX_EXECUTOR:-docker}
    SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-runc}
    SANDBOX_ENGINE_IMAGE: ${SANDBOX_ENGINE_IMAGE:-hanson-sandbox-runtime:local}
    SANDBOX_ENGINE_VERSION: ${SANDBOX_ENGINE_VERSION:-sandbox-engine/1}
    SANDBOX_DOCKER_SOCKET: /var/run/docker.sock
    SANDBOX_WORKSPACE_ROOT: /tmp/hanson-sandbox
    SANDBOX_RUN_TIMEOUT_SECONDS: ${SANDBOX_RUN_TIMEOUT_SECONDS:-120}
    SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-300}
    SANDBOX_TEMPLATE_ID: ${SANDBOX_TEMPLATE_ID:-product_full}
    SANDBOX_TEMPLATE_VERSION: ${SANDBOX_TEMPLATE_VERSION:-1.0.0}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_started
  networks:
    - hanson

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hanson
      POSTGRES_PASSWORD: hanson
      POSTGRES_DB: hanson
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanson -d hanson"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - hanson

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio-data:/data
    networks:
      - hanson

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - hanson

  api-gateway:
    <<: *app
    command: ["uvicorn", "services.api_gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "18000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 10

  orchestration:
    <<: *app
    command: ["uvicorn", "services.orchestration.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "18001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 10

  ocr:
    <<: *app
    command: ["uvicorn", "services.ocr.main:app", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "18002:8002"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 10

  agent:
    <<: *app
    command: ["uvicorn", "services.agent.main:app", "--host", "0.0.0.0", "--port", "8003"]
    ports:
      - "18003:8003"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 10

  sandbox:
    <<: *app
    command: ["uvicorn", "services.sandbox.main:app", "--host", "0.0.0.0", "--port", "8004"]
    ports:
      - "18004:8004"
    volumes:
      # Docker-outside-of-Docker: the sandbox service creates short-lived
      # sibling containers on the host daemon. The execution container never
      # receives the socket.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 10

  recipe-registry:
    <<: *app
    command: ["uvicorn", "services.recipe_registry.main:app", "--host", "0.0.0.0", "--port", "8005"]
    ports:
      - "18005:8005"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 10

  review:
    <<: *app
    command: ["uvicorn", "services.review.main:app", "--host", "0.0.0.0", "--port", "8006"]
    ports:
      - "18006:8006"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8006/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 10

  # 构建型服务：只用于构建沙箱引擎镜像，不参与默认启动。
  #   docker compose --profile build build sandbox-runtime
  sandbox-runtime:
    profiles: ["build"]
    build:
      context: ../..
      dockerfile: services/sandbox/runtime/Dockerfile
    image: hanson-sandbox-runtime:local
    command: ["true"]

volumes:
  postgres-data:
  minio-data:

networks:
  hanson:
    driver: bridge
