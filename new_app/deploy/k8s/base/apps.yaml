apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: hanson-standard
  labels:
    app.kubernetes.io/part-of: hanson-standard-split
data:
  DATABASE_URL: postgresql://hanson:hanson@postgres:5432/hanson
  REDIS_URL: redis://redis:6379/0
  OBJECT_STORAGE_ENDPOINT: http://minio:9000
  OBJECT_STORAGE_BUCKET: hanson-docs
  OBJECT_STORAGE_ACCESS_KEY: minioadmin
  OBJECT_STORAGE_SECRET_KEY: minioadmin
  ORCHESTRATION_URL: http://orchestration:8001
  MOCK_STAGE_DELAY_SECONDS: "0.2"
  STAGE_MAX_ATTEMPTS: "2"
  STAGE_RETRY_BACKOFF_SECONDS: "0.5"
  MOCK_FAIL_STAGE: ""
  MOCK_FAIL_TIMES: "0"
  OCR_URL: http://ocr:8002
  OCR_BACKEND: auto
  OCR_DPI: "150"
  OCR_USE_FAKE: "false"
  GLM_OCR_BASE_URL: http://192.168.1.35:9977/v1
  GLM_OCR_MODEL: GLM-OCR
  GLM_OCR_TIMEOUT_SECONDS: "180"
  LAYOUT_BASE_URL: http://192.168.1.35:9978
  LAYOUT_TIMEOUT_SECONDS: "60"
  RECIPE_REGISTRY_URL: http://recipe-registry:8005
  ROUTE_USE_FAKE: "false"
  SANDBOX_URL: http://sandbox:8004
  SANDBOX_USE_FAKE: "false"
  SANDBOX_EXECUTOR: kubernetes
  SANDBOX_RUNTIME: containerd
  SANDBOX_ENGINE_IMAGE: hanson-sandbox-runtime:local
  SANDBOX_ENGINE_VERSION: sandbox-engine/1
  SANDBOX_RUN_TIMEOUT_SECONDS: "120"
  SANDBOX_TIMEOUT_SECONDS: "300"
  SANDBOX_TEMPLATE_ID: product_full
  SANDBOX_TEMPLATE_VERSION: 1.0.0
  SANDBOX_KUBERNETES_NAMESPACE: hanson-standard
  AGENT_MODEL: Qwen3.6-35B-A3B-NVFP4
  AGENT_CONTEXT_WINDOW: "65536"
  AGENT_FAILOVER_SECONDS: "10"
  AGENT_BASE_URL_PRIMARY: http://39.107.239.208:35035
  AGENT_BASE_URL_SECONDARY: http://192.168.188.75:9991
  AGENT_BASE_URL_TERTIARY: http://192.168.1.35:9988
  AGENT_TOKENIZER_MODE: remote
  AGENT_SESSION_DB: /tmp/hanson-agent/sessions.db
  REVIEW_URL: http://review:8006
  REVIEW_AGENT_URL: http://agent:8003
  REVIEW_USE_AGENT: "true"
  AGENT_URL: http://agent:8003
  FEEDBACK_TIMEOUT_SECONDS: "300"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: hanson-standard
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: hanson-standard-split
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: hanson-new-app:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "services.api_gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: hanson-standard
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: hanson-standard-split
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestration
  namespace: hanson-standard
  labels:
    app: orchestration
    app.kubernetes.io/part-of: hanson-standard-split
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestration
  template:
    metadata:
      labels:
        app: orchestration
    spec:
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U hanson; do echo waiting-for-postgres; sleep 2; done
      containers:
        - name: orchestration
          image: hanson-new-app:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "services.orchestration.main:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orchestration
  namespace: hanson-standard
  labels:
    app: orchestration
    app.kubernetes.io/part-of: hanson-standard-split
spec:
  selector:
    app: orchestration
  ports:
    - name: http
      port: 8001
      targetPort: http
---
