apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: hanson-standard
  labels:
    app.kubernetes.io/part-of: hanson-standard-split
data:
  DATABASE_URL: postgresql://hanson:hanson@postgres:5432/hanson
  REDIS_URL: redis://redis:6379/0
  OBJECT_STORAGE_ENDPOINT: http://minio:9000
  OBJECT_STORAGE_BUCKET: hanson-docs
  OBJECT_STORAGE_ACCESS_KEY: minioadmin
  OBJECT_STORAGE_SECRET_KEY: minioadmin
  ORCHESTRATION_URL: http://orchestration:8001
  MOCK_STAGE_DELAY_SECONDS: "0.2"
  STAGE_MAX_ATTEMPTS: "2"
  STAGE_RETRY_BACKOFF_SECONDS: "0.5"
  MOCK_FAIL_STAGE: ""
  MOCK_FAIL_TIMES: "0"
  AGENT_MODEL: Qwen-35B
  AGENT_CONTEXT_WINDOW: "65536"
  AGENT_FAILOVER_SECONDS: "10"
  AGENT_BASE_URL_TERTIARY: http://192.168.1.35
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: hanson-standard
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: hanson-standard-split
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: hanson-new-app:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "services.api_gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: hanson-standard
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: hanson-standard-split
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestration
  namespace: hanson-standard
  labels:
    app: orchestration
    app.kubernetes.io/part-of: hanson-standard-split
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestration
  template:
    metadata:
      labels:
        app: orchestration
    spec:
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U hanson; do echo waiting-for-postgres; sleep 2; done
      containers:
        - name: orchestration
          image: hanson-new-app:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "services.orchestration.main:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orchestration
  namespace: hanson-standard
  labels:
    app: orchestration
    app.kubernetes.io/part-of: hanson-standard-split
spec:
  selector:
    app: orchestration
  ports:
    - name: http
      port: 8001
      targetPort: http
---
