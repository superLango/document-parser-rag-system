components:
  schemas:
    Body_upload_document_v1_documents_post:
      properties:
        file:
          contentMediaType: application/octet-stream
          title: File
          type: string
      required:
      - file
      title: Body_upload_document_v1_documents_post
      type: object
    CreateRunRequest:
      properties:
        parse_profile:
          default: standard
          title: Parse Profile
          type: string
        recipe_channel:
          default: stable
          title: Recipe Channel
          type: string
      title: CreateRunRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ReparseRequest:
      properties:
        parser_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Parser Version
      title: ReparseRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
