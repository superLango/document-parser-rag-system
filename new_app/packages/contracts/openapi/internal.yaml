info:
  title: Hanson orchestration
  version: 0.0.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: healthz_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Healthz Healthz Get
                type: object
          description: Successful Response
      summary: Healthz
  /internal/dictionary:
    get:
      operationId: list_entries_internal_dictionary_get
      parameters:
      - in: query
        name: type
        required: false
        schema:
          default: ''
          title: Type
          type: string
      - in: query
        name: q
        required: false
        schema:
          default: ''
          title: Q
          type: string
      - in: query
        name: family
        required: false
        schema:
          default: ''
          title: Family
          type: string
      - in: query
        name: status
        required: false
        schema:
          default: ''
          title: Status
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 500
          maximum: 2000
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Entries Internal Dictionary Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Entries
  /internal/documents:
    get:
      operationId: list_documents_internal_documents_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DocumentOut'
                title: Response List Documents Internal Documents Get
                type: array
          description: Successful Response
      summary: List Documents
    post:
      operationId: upload_document_internal_documents_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_document_internal_documents_post'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Upload Document
  /internal/documents/{document_id}:
    delete:
      operationId: delete_document_internal_documents__document_id__delete
      parameters:
      - in: path
        name: document_id
        required: true
        schema:
          title: Document Id
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Document
    get:
      operationId: get_document_internal_documents__document_id__get
      parameters:
      - in: path
        name: document_id
        required: true
        schema:
          title: Document Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Document
  /internal/documents/{document_id}/runs:
    post:
      operationId: create_run_internal_documents__document_id__runs_post
      parameters:
      - in: path
        name: document_id
        required: true
        schema:
          title: Document Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Run
  /internal/documents/{document_id}/snapshot:
    get:
      operationId: get_document_snapshot_internal_documents__document_id__snapshot_get
      parameters:
      - in: path
        name: document_id
        required: true
        schema:
          title: Document Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Document Snapshot Internal Documents  Document Id  Snapshot Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Document Snapshot
  /internal/feedback:
    get:
      operationId: list_feedback_internal_feedback_get
      parameters:
      - in: query
        name: status
        required: false
        schema:
          default: ''
          title: Status
          type: string
      - in: query
        name: document_id
        required: false
        schema:
          default: ''
          title: Document Id
          type: string
      - in: query
        name: run_id
        required: false
        schema:
          default: ''
          title: Run Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FeedbackDetail'
                title: Response List Feedback Internal Feedback Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Feedback
    post:
      operationId: create_feedback_internal_feedback_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackDetail'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Feedback
  /internal/feedback/{feedback_id}:
    get:
      operationId: get_feedback_internal_feedback__feedback_id__get
      parameters:
      - in: path
        name: feedback_id
        required: true
        schema:
          title: Feedback Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackDetail'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Feedback
  /internal/feedback/{feedback_id}/process:
    post:
      operationId: process_feedback_internal_feedback__feedback_id__process_post
      parameters:
      - in: path
        name: feedback_id
        required: true
        schema:
          title: Feedback Id
          type: string
      responses:
