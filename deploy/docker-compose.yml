version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: hansight-postgres
    environment:
      POSTGRES_DB: docparser
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      postgres
      -c shared_buffers=4GB
      -c work_mem=64MB
      -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docparser"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: hansight-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
      - ./valkey.conf:/usr/local/etc/valkey/valkey.conf
    command: valkey-server /usr/local/etc/valkey/valkey.conf
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: hansight-seaweedfs
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports:
      - "9000:8333"
      - "9001:8888"
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs_s3.json:/etc/seaweedfs/s3.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/status"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ===============================================================
  # NebulaGraph 图数据库（3 节点：metad 元数据 / storaged 存储 / graphd 查询）
  # 替代原 Neo4j：开源 Apache 2.0，原生多 graph space 物理隔离，
  # 每 KB 一个 graph space（kb_{kb_id_hex}），无需 Enterprise 授权。
  # ===============================================================
  nebula-metad:
    image: vesoft/nebula-metad:v3.8.0
    container_name: hansight-nebula-metad
    environment:
      USER: root
    command:
      - meta
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-metad
      - --ws_ip=nebula-metad
      - --port=9559
      - --ws_http_port=19559
      - --data_path=/data/meta
      - --log_dir=/logs
    ports:
      - "9559:9559"
      - "19559:19559"
    volumes:
      - nebula_meta_data:/data/meta
      - nebula_meta_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:19559/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  nebula-storaged:
    image: vesoft/nebula-storaged:v3.8.0
    container_name: hansight-nebula-storaged
    environment:
      USER: root
    command:
      - storage
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-storaged
      - --ws_ip=nebula-storaged
      - --port=9779
      - --ws_http_port=19779
      - --data_path=/data/storage
      - --log_dir=/logs
    ports:
      - "9779:9779"
      - "19779:19779"
    volumes:
      - nebula_storage_data:/data/storage
      - nebula_storage_logs:/logs
    depends_on:
      - nebula-metad
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:19779/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  nebula-graphd:
    image: vesoft/nebula-graphd:v3.8.0
    container_name: hansight-nebula-graphd
    environment:
      USER: root
    command:
      - graph
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-graphd
      - --ws_ip=nebula-graphd
      - --port=9669
      - --ws_http_port=19669
      - --log_dir=/logs
      - --local_config=true
    ports:
      - "9669:9669"
      - "19669:19669"
    volumes:
      - nebula_graph_logs:/logs
    depends_on:
      - nebula-metad
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:19669/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 40s
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: hansight-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - -advertise-client-urls=http://etcd:2379
      - -listen-client-urls=http://0.0.0.0:2379
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: hansight-milvus
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: seaweedfs:8333
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: a-bucket
    volumes:
      - milvus_data:/var/lib/milvus
      # 挂载自定义 milvus.yaml（已将 proxy.maxVectorFieldNum 从默认 4 提升到 10，
      # 支持单 Collection 5 个向量字段）。容器重建后配置不丢失。
      - ./milvus_config/milvus.yaml:/milvus/configs/milvus.yaml
    depends_on:
      - etcd
      - seaweedfs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ===============================================================
  # 应用服务层
  # ===============================================================

  # ---- 后端 API 服务 ----
  # FastAPI 应用，提供 REST API / WebSocket / SSE
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: hansight-backend
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      milvus:
        condition: service_healthy
      nebula-graphd:
        condition: service_healthy
    environment:
      # 应用基础配置
      APP_NAME: Hansight
      APP_ENV: production
      DEBUG: "false"
      # PostgreSQL 数据库（连接 docker 内部服务名 postgres）
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: docparser
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/docparser
      # Valkey（Redis 兼容）连接
      REDIS_URL: redis://valkey:6379/0
      # SeaweedFS（S3 兼容对象存储）
      MINIO_ENDPOINT: seaweedfs:8333
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: documents
      MINIO_SECURE: "false"
      S3_ENDPOINT_URL: http://seaweedfs:8333
      # NebulaGraph 图数据库（替代 Neo4j，每 KB 一个 graph space）
      NEBULA_GRAPHD_HOST: nebula-graphd
      NEBULA_GRAPHD_PORT: "9669"
      NEBULA_USER: root
      NEBULA_PASSWORD: ${NEBULA_PASSWORD:-nebula}
      # Milvus 向量数据库
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      MILVUS_COLLECTION: doc_chunks
      # 模型路径（挂载宿主机 models 目录到容器内 /app/models）
      EMBEDDING_MODEL_PATH: /app/models/bge-m3
      RERANKER_MODEL_DIR: /app/models/bge-reranker-v2-m3
      POPO_MODEL_DIR: /app/models/MinerU-Popo
      PADDLE_OCR_MODEL_DIR: /app/models/PaddlePaddle/PaddleOCR-VL
      # JWT 鉴权（生产环境必须替换 SECRET_KEY）
      SECRET_KEY: ${JWT_SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      # Ollama 大模型服务
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: gemma2:2b
      # 文件上传限制
      MAX_FILE_SIZE: "524288000"
      ALLOWED_EXTENSIONS: .pdf,.png,.jpg,.jpeg,.tiff,.bmp
    ports:
      - "8000:8000"
    volumes:
      # 挂载模型目录（OCR / 嵌入 / 重排模型）
      - ../models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ---- arq 异步任务 Worker ----
  # 执行文档解析、向量入库、知识图谱构建等耗时任务，需要 GPU
  arq-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: hansight-arq-worker
    command: arq app.tasks.arq_worker.WorkerSettings
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      # 与 backend 共享相同的应用配置
      APP_NAME: Hansight-Worker
      APP_ENV: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: docparser
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/docparser
      REDIS_URL: redis://valkey:6379/0
      MINIO_ENDPOINT: seaweedfs:8333
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: documents
      MINIO_SECURE: "false"
      S3_ENDPOINT_URL: http://seaweedfs:8333
      # NebulaGraph 图数据库
      NEBULA_GRAPHD_HOST: nebula-graphd
      NEBULA_GRAPHD_PORT: "9669"
      NEBULA_USER: root
      NEBULA_PASSWORD: ${NEBULA_PASSWORD:-nebula}
      # Milvus 向量数据库
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      MILVUS_COLLECTION: doc_chunks
      EMBEDDING_MODEL_PATH: /app/models/bge-m3
      RERANKER_MODEL_DIR: /app/models/bge-reranker-v2-m3
      POPO_MODEL_DIR: /app/models/MinerU-Popo
      PADDLE_OCR_MODEL_DIR: /app/models/PaddlePaddle/PaddleOCR-VL
      SECRET_KEY: ${JWT_SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: gemma2:2b
      MAX_FILE_SIZE: "524288000"
      ALLOWED_EXTENSIONS: .pdf,.png,.jpg,.jpeg,.tiff,.bmp
    volumes:
      # OCR / 嵌入 / 重排模型，与 backend 共用同一宿主机目录
      - ../models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped

  # ---- 前端 Web 服务 ----
  # Vue3 SPA，由 nginx 提供静态资源并反向代理后端 API
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: hansight-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ===============================================================
  # 监控服务层
  # ===============================================================

  # ---- Prometheus 指标采集 ----
  prometheus:
    image: prom/prometheus:latest
    container_name: hansight-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    # 允许 Prometheus 访问宿主机上的 vLLM metrics（端口 9988）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    restart: unless-stopped

  # ---- Grafana 可视化面板 ----
  # 端口映射 3001:3000 以避免与 TRAE IDE 端口冲突
  grafana:
    image: grafana/grafana:latest
    container_name: hansight-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  valkey_data:
  seaweedfs_data:
  nebula_meta_data:
  nebula_meta_logs:
  nebula_storage_data:
  nebula_storage_logs:
  nebula_graph_logs:
  etcd_data:
  milvus_data:
  prometheus_data:
  grafana_data:
