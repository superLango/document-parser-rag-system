components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: M1.9 平台登录后签发的访问令牌
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 外部系统对接（API Key）
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
    ExtractionId:
      name: extraction_id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 2000
        default: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
  responses:
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 未认证或令牌失效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 无权限（作用域或知识库成员）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotReady:
      description: 产物尚未生成（任务未完成）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: 请求不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          description: 错误描述或结构化错误对象
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        trace_id:
          type: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    UserOut:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: string
        username:
          type: string
        display_name:
          type: string
        role:
          type: string

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: bearer
        expires_in:
          type: integer
        user:
          $ref: "#/components/schemas/UserOut"

    KnowledgeBaseCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    KnowledgeBase:
      type: object
      required: [id, name, owner_id]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        owner_id:
          type: string
        created_at:
          type: string
          format: date-time
        document_count:
          type: integer

    Task:
      type: object
      required: [document_id, job_id, status]
      properties:
        document_id:
          type: string
        kb_id:
          type: [string, "null"]
        job_id:
          type: string
        kind:
          type: string
        version:
          type: integer
        locked:
          type: boolean
        status:
          type: string
          enum: [queued, running, succeeded, failed, review]
        stage:
          type: string
        progress:
          type: integer
        error:
          type: [string, "null"]
        result_status:
          type: [string, "null"]
        summary:
          type: object
          additionalProperties: true
        source_name:
          type: [string, "null"]
        created_at:
          type: [string, "null"]

    DocumentOut:
      type: object
      required: [id, kb_id, file_name, status]
      properties:
        id:
          type: string
        kb_id:
          type: string
        file_name:
          type: string
        sha256:
          type: string
        status:
          type: string
          enum: [uploaded, queued, running, succeeded, failed, review]
        job_id:
          type: [string, "null"]
        review_status:
          type: string
          enum: [draft, review, confirmed]
        review_version:
          type: integer
        confirmed_job_id:
          type: [string, "null"]
        confirmed_by:
          type: [string, "null"]
        confirmed_at:
          type: [string, "null"]
          format: date-time
        results_job_id:
          type: [string, "null"]
        results_synced_at:
          type: [string, "null"]
          format: date-time
        standard_no:
          type: [string, "null"]
        title:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        task:
          $ref: "#/components/schemas/Task"

    DocumentReviewRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [submit, confirm]
        reason:
          type: string

    DocumentReviewResult:
      type: object
      required: [document_id, review_status, review_version]
      properties:
        document_id:
          type: string
        review_status:
          type: string
          enum: [draft, review, confirmed]
        review_version:
          type: integer
        job_id:
          type: [string, "null"]
        confirmed_job_id:
          type: [string, "null"]
        pending_new_terms:
          type: integer
        confirmed_by:
          type: [string, "null"]
        confirmed_at:
          type: [string, "null"]
          format: date-time
        message:
          type: string

    Share:
      type: object
      required: [token, expires_at, path]
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        path:
          type: string

    PreviewPage:
      type: object
      required: [page_no, markdown]
      properties:
        page_no:
          type: integer
        markdown:
          type: string
        image:
          type: [string, "null"]
          description: 产物内相对路径
        layout:
          type: [string, "null"]
        image_url:
          type: [string, "null"]
        layout_url:
          type: [string, "null"]

    Preview:
      type: object
      required: [doc_id, page_count, pages]
      properties:
        doc_id:
          type: string
        page_count:
          type: integer
        pages:
          type: array
          items:
            $ref: "#/components/schemas/PreviewPage"

    LayoutBlock:
      type: object
      required: [type, bbox, order]
      properties:
        type:
          type: string
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
        order:
          type: integer
        confidence:
          type: number
        text:
          type: [string, "null"]
        error:
          type: [string, "null"]
        structural:
          type: object
          additionalProperties: true

    LayoutPage:
      type: object
      required: [page_no, blocks]
      properties:
        page_no:
          type: integer
        width:
          type: [number, "null"]
        height:
          type: [number, "null"]
        dpi:
          type: [integer, "null"]
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/LayoutBlock"

    ApiKeyCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string

    ApiKey:
      type: object
      required: [id, name, prefix, scopes]
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
        key:
          type: [string, "null"]
          description: 仅创建响应返回一次

    AuditLog:
      type: object
      required: [id, action]
      properties:
        id:
          type: string
        actor_id:
          type: string
        actor_type:
          type: string
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        detail:
          type: string
        created_at:
          type: string
          format: date-time

    JobState:
      type: object
      required: [job_id, status, stage, progress]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed, review]
        stage:
          type: string
        progress:
          type: integer
          minimum: 0
          maximum: 100
        result_status:
          type: [string, "null"]
        doc_path:
          type: string
        out_dir:
          type: string
        error:
          type: [string, "null"]
        source_name:
          type: [string, "null"]
        source_sha256:
          type: [string, "null"]
        created_at:
          type: [string, "null"]
        updated_at:
          type: [string, "null"]
        finished_at:
          type: [string, "null"]
        idempotency_key:
          type: [string, "null"]
        attempts:
          type: integer
        options:
          type: object
          additionalProperties:
            type: string
        summary:
          type: object
          additionalProperties:
            type: integer
        artifact_manifest:
          type: [string, "null"]

    PropertyMatch:
      type: object
      required: [raw, match_type, status]
      properties:
        raw:
          type: string
          description: 属性代码，如 Rm / Rp0.2 / HBW / C
        canonical_id:
          type: [string, "null"]
        canonical_name:
          type: [string, "null"]
        match_type:
          type: string
