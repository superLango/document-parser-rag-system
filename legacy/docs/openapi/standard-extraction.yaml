openapi: 3.1.0
info:
  title: Hanson 金属标准拆分平台 API
  version: 0.1.0-draft
  description: |
    M1.9a API 草案，以最终前端消费为准。

    端点分两类：
    - `x-status: implemented`：当前引擎已实现，可直接联调；
    - `x-status: planned`：M1.9 平台化目标契约，尚未实现。

    标记为 implemented 的端点由 `tools/export_openapi.py` 生成实时契约，
    并与 `metal-doc-agent/tests/test_openapi.py` 做路由一致性校验。
  contact:
    name: Hanson Doc Parse
servers:
  - url: http://127.0.0.1:8765
    description: 本地引擎 / 开发环境
  - url: https://api.example.local
    description: 生产（占位，M1.9 部署时替换）
tags:
  - name: auth
    description: 登录与当前用户
  - name: jobs
    description: 引擎任务（当前实现）
  - name: documents
    description: 文档、拆分结果与证据
  - name: knowledge-bases
    description: 知识库
  - name: tasks
    description: 解析/拆分任务中心
  - name: api-keys
    description: 外部对接密钥
  - name: audit
    description: 审计日志
  - name: standard-extractions
    description: 标准拆分（目标契约）
  - name: business-dictionary
    description: 业务词典（项目大类 / 检测项目 / 试验方法）
  - name: system
    description: 健康检查与配方
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: 健康检查
      x-status: implemented
      security: []
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/recipes:
    get:
      tags: [system]
      operationId: listRecipes
      summary: 覆盖模板列表
      x-status: implemented
      responses:
        "200":
          description: 模板名与字段数
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                    field_count:
                      type: integer
                    required_count:
                      type: integer

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 账号密码登录
      x-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 访问令牌与用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentPrincipal
      summary: 当前用户或 API Key 身份
      x-status: implemented
      responses:
        "200":
          description: 身份信息
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/knowledge-bases:
    get:
      tags: [knowledge-bases]
      operationId: listKnowledgeBases
      summary: 我参与的知识库
      x-status: implemented
      responses:
        "200":
          description: 知识库列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeBase"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [knowledge-bases]
      operationId: createKnowledgeBase
      summary: 创建知识库（创建者为 owner）
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeBaseCreate"
      responses:
        "201":
          description: 知识库
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/knowledge-bases/{kb_id}:
    get:
      tags: [knowledge-bases]
      operationId: getKnowledgeBase
      summary: 知识库详情（含文档数）
      x-status: implemented
      parameters:
        - name: kb_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 知识库
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: 知识库内的解析/拆分任务（缺省为当前用户全部知识库）
      x-status: implemented
      parameters:
        - name: kb_id
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/tasks/{job_id}:
    get:
      tags: [tasks]
      operationId: getTask
      summary: 任务详情
      x-status: implemented
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/tasks/{job_id}/retry:
    post:
      tags: [tasks]
      operationId: retryTask
      summary: 重试失败或待复核任务
      x-status: implemented
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: 已重新排队
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          $ref: "#/components/responses/NotReady"

  /v1/api-keys:
    get:
      tags: [api-keys]
      operationId: listApiKeys
      summary: 我的 API Key（不含明文）
      x-status: implemented
      responses:
        "200":
          description: API Key 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [api-keys]
      operationId: createApiKey
      summary: 创建 API Key（明文只返回一次）
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyCreate"
      responses:
        "201":
          description: 新密钥
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/api-keys/{key_id}:
    delete:
      tags: [api-keys]
      operationId: revokeApiKey
      summary: 撤销 API Key
      x-status: implemented
      parameters:
        - name: key_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 已撤销
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/audit-logs:
    get:
      tags: [audit]
      operationId: listAuditLogs
      summary: 审计日志
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 审计日志列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/share/{token}:
    get:
      tags: [documents]
      operationId: getSharedDocument
      summary: 短期签名分享（无需登录）
      x-status: implemented
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 文档、任务与拆分结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/business-dictionary:
    get:
      tags: [business-dictionary]
      operationId: getBusinessDictionary
      summary: 查询业务词典快照
      x-status: implemented
      parameters:
        - name: type
          in: query
          description: 词典类型
          schema:
            type: string
            enum: [category, item, method]
        - name: q
          in: query
          description: 名称或别名包含的关键字
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 词典版本、统计与条目
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessDictionary"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [business-dictionary]
      operationId: syncBusinessDictionary
      summary: 同步业务词典
      description: 从业务系统或快照重新导入，返回差异与版本。
      x-status: planned
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  enum: [snapshot, api, db]
                path:
                  type: string
      responses:
        "200":
          description: 同步结果
          content:
            application/json:
              schema:
                type: object
                required: [version, added, removed, changed]
                properties:
                  version:
                    type: string
                  added:
                    type: integer
                  removed:
                    type: integer
                  changed:
                    type: integer

  /v1/jobs:
    post:
      tags: [jobs]
      operationId: createJob
      summary: 上传文档并创建解析任务
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                template:
                  type: string
                  default: product_full
                ocr:
                  type: string
                  enum: [mock, glm]
                  default: mock
                extractor:
                  type: string
                  enum: [mock, qwen]
                  default: mock
      responses:
        "201":
          description: 新任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobState"
        "200":
          description: 幂等重放
          headers:
            X-Idempotent-Replay:
              schema:
                type: string
                const: "true"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobState"
        "415":
          $ref: "#/components/responses/BadRequest"
    get:
      tags: [jobs]
      operationId: listJobs
      summary: 任务列表
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 按创建时间倒序
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobState"

  /v1/jobs/{job_id}:
    get:
      tags: [jobs]
      operationId: getJob
      summary: 任务状态
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 任务状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobState"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/jobs/{job_id}/result:
    get:
      tags: [jobs]
      operationId: getJobResult
      summary: 文档、表格、记录与覆盖结果
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: DocumentResult
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "409":
          $ref: "#/components/responses/NotReady"

  /v1/jobs/{job_id}/items:
    get:
      tags: [jobs]
      operationId: getJobItems
      summary: 项目清单（含业务大类与检测项目匹配）
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 对齐后的 ItemInventory；无词典时返回未对齐版本
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemInventory"
        "409":
          $ref: "#/components/responses/NotReady"

  /v1/jobs/{job_id}/records:
    get:
      tags: [jobs]
      operationId: getJobRecords
      summary: 抽取记录（牌号 × 条件 × 属性）
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Record 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Record"
        "409":
          $ref: "#/components/responses/NotReady"

  /v1/jobs/{job_id}/alignment:
    get:
      tags: [jobs]
      operationId: getJobAlignment
      summary: 业务对齐结果
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: AlignmentResult
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlignmentResult"
        "409":
          $ref: "#/components/responses/NotReady"

  /v1/jobs/{job_id}/new-terms:
    get:
      tags: [jobs]
      operationId: getJobNewTerms
      summary: 新词候选（项目大类 / 检测项目 / 试验方法）
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: NewTermStore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewTermStore"
        "409":
          $ref: "#/components/responses/NotReady"

  /v1/jobs/{job_id}/clauses:
    get:
      tags: [jobs]
      operationId: getJobClauses
      summary: 条款记录
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: ClauseRecord 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClauseRecord"
        "409":
          $ref: "#/components/responses/NotReady"

  /v1/jobs/{job_id}/links:
    get:
      tags: [jobs]
      operationId: getJobTableClauseLinks
      summary: 表-条款链接
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: TableClauseLinks
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "409":
          $ref: "#/components/responses/NotReady"

  /v1/jobs/{job_id}/coverage-audit:
    get:
      tags: [jobs]
      operationId: getJobCoverageAudit
      summary: 覆盖审计（测量列、条款提及、孤儿表）
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: CoverageAudit
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "409":
          $ref: "#/components/responses/NotReady"

  /v1/jobs/{job_id}/evidence:
    get:
      tags: [jobs]
      operationId: getJobEvidence
      summary: 证据列表
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Evidence 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evidence"
        "409":
          $ref: "#/components/responses/NotReady"

  /v1/jobs/{job_id}/audit:
    get:
      tags: [jobs]
      operationId: getJobAudit
      summary: 人类可读审核报告
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Markdown
          content:
            text/markdown:
              schema:
                type: string
        "409":
          $ref: "#/components/responses/NotReady"

  /v1/jobs/{job_id}/trace:
    get:
      tags: [jobs]
      operationId: getJobTrace
      summary: 运行轨迹与版本
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: trace.json
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "409":
          $ref: "#/components/responses/NotReady"

  /v1/jobs/{job_id}/artifacts:
    get:
      tags: [jobs]
      operationId: getJobArtifacts
      summary: 产物清单（SHA256 + 大小）
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: ArtifactManifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactManifest"
        "409":
          $ref: "#/components/responses/NotReady"

  /v1/jobs/{job_id}/artifacts/verify:
    get:
      tags: [jobs]
      operationId: verifyJobArtifacts
      summary: 校验产物完整性
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 校验结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationResult"
        "409":
          $ref: "#/components/responses/NotReady"

  /v1/jobs/{job_id}/retry:
    post:
      tags: [jobs]
      operationId: retryJob
      summary: 重试失败或待复核任务
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "202":
          description: 已重新排队
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobState"
        "409":
          $ref: "#/components/responses/NotReady"

  /v1/documents:
    post:
      tags: [documents]
      operationId: createDocument
      summary: 上传文档（平台文档模型）
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                kb_id:
                  type: string
                template:
                  type: string
      responses:
        "201":
          description: 文档摘要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentOut"
    get:
      tags: [documents]
      operationId: listDocuments
      summary: 文档列表
      x-status: implemented
      parameters:
        - name: kb_id
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 文档摘要列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentOut"

  /v1/documents/{document_id}:
    get:
      tags: [documents]
      operationId: getDocument
      summary: 文档详情与解析状态
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: 文档摘要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentOut"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/documents/{document_id}/parse:
    post:
      tags: [documents]
      operationId: parseDocument
      summary: 开始解析与标准拆分
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "202":
          description: 任务已排队
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobState"

  /v1/documents/{document_id}/items:
    get:
      tags: [documents]
      operationId: getDocumentItems
      summary: 文档项目清单
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: ItemInventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemInventory"
        "409":
          $ref: "#/components/responses/NotReady"

  /v1/documents/{document_id}/records:
    get:
      tags: [documents]
      operationId: getDocumentRecords
      summary: 文档记录（结果索引表）
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Record 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Record"
        "409":
          $ref: "#/components/responses/NotReady"

  /v1/documents/{document_id}/alignment:
    get:
      tags: [documents]
      operationId: getDocumentAlignment
      summary: 文档业务对齐结果
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: AlignmentResult
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlignmentResult"
        "409":
          $ref: "#/components/responses/NotReady"

  /v1/documents/{document_id}/result:
    get:
      tags: [documents]
      operationId: getDocumentResult
      summary: 记录 / 条款 / 覆盖结果
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: DocumentResult
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "409":
          $ref: "#/components/responses/NotReady"

  /v1/documents/{document_id}/results/sync:
    post:
      tags: [documents]
      operationId: syncDocumentResults
      summary: 将当前任务产物同步到结果索引表
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "202":
          description: 同步计数
          content:
            application/json:
              schema:
                type: object
