apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: metal-agent
  labels:
    app: platform-api
    plane: platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: platform-api
  template:
    metadata:
      labels:
        app: platform-api
        plane: platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /platform/metrics
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: migrate
          image: ghcr.io/hanson/hanson-platform-api:0.1.0
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
      containers:
        - name: api
          image: ghcr.io/hanson/hanson-platform-api:0.1.0
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: platform-config
            - configMapRef:
                name: engine-config
            - secretRef:
                name: platform-secrets
          readinessProbe:
            httpGet:
              path: /platform/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: platform-data
              mountPath: /data/platform
            - name: engine-data
              mountPath: /data/engine
      volumes:
        - name: platform-data
          persistentVolumeClaim:
            claimName: platform-data
        - name: engine-data
          persistentVolumeClaim:
            claimName: engine-data
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: metal-agent
spec:
  type: ClusterIP
  selector:
    app: platform-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: metal-agent
  labels:
    app: web
    plane: platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        plane: platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: web
          image: ghcr.io/hanson/hanson-web:0.1.0
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: metal-agent
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
