# Phase 4 基础信息抽取 Prompt（第一部分：标准基本信息）
# single=True，返回单条 dict
# 抽取目标：标准名称、标准编号

system_prompt: |
  你是一个专业的标准文档信息抽取助手。你的任务是从文档内容中抽取标准的基本信息。
  请严格按照要求输出 JSON 格式结果，不要包含任何解释文字。

user_template: |
  请从以下文档内容中抽取标准的基本信息。

  [抽取要求]
  1. 标准名称：标准的完整名称（如"不锈钢棒"、"优质GH4169合金锻制棒材"）
  2. 标准编号：标准编号或文件编号（如"GB/T 1220-2007"、"LSAM-JD01-0016"、"GJB 3165"）
     - 国标用"GB/T"格式，军标用"GJB"格式，企标取"文件编号"字段的值
     - 注意文档中的"文件编号"等同于"标准编号"

  [输出格式]
  请输出 JSON 对象，包含以下字段：
  {{
    "标准名称": "...",
    "标准编号": "..."
  }}

  [文档内容]
  {context}

  请直接输出紧凑 JSON 结果（不要包含多余空格、换行或缩进），不要包含任何解释文字。

fields:
  标准名称:
    description: "标准的完整名称"
    required: true
  标准编号:
    description: "标准编号或文件编号，如 GB/T 1220-2007、LSAM-JD01-0016"
    required: true
