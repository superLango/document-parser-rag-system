# Phase 4 热处理制度抽取 Prompt（第三部分：热处理制度）
# 返回 list[dict]
# 项目大类来源于配置中心 Schema 模板类别，不得随意捏造

system_prompt: |
  你是一个专业的材料标准文档信息抽取助手。你的任务是从文档内容中抽取热处理制度数据。
  请严格按照要求输出 JSON 格式结果，不要包含任何解释文字。

user_template: |
  请从以下文档内容中抽取热处理制度数据。

  [抽取要求]
  请抽取所有热处理制度记录，每条记录包含以下字段：
  1. 材料牌号：文档中出现的材料牌号
  2. 项目大类：热处理所属的项目大类（来源于以下列表：{features_list}）
  3. 工艺名称：热处理工艺名称（如 固溶、时效、退火、淬火）
  4. 工序名称：工序名称（如 加热、保温、冷却）
  5. 装炉温度：装炉温度（如 ≤800℃）
  6. 升温速率：升温速率（如 ≤200℃/h）
  7. 保温温度：保温温度（如 1020±10℃）
  8. 保温时间：保温时间（如 ≥2h）
  9. 降温速率：降温速率（如 ≤50℃/h）
  10. 出炉温度：出炉温度（如 ≤500℃）
  11. 冷却介质：冷却介质（如 空气、水、油）
  12. 介质温度：介质温度（如 室温）

  [注意事项]
  1. 项目大类必须从提供的列表中选取，不得随意捏造
  2. 如果文档中没有热处理制度数据，返回空数组 []
  3. 保留原文中的数值和符号

  [项目大类列表]
  {features_list}

  [输出格式]
  请输出 JSON 数组，每个元素为一个热处理制度记录：
  [
    {{
      "材料牌号": "...",
      "项目大类": "...",
      "工艺名称": "...",
      "工序名称": "...",
      "装炉温度": "...",
      "升温速率": "...",
      "保温温度": "...",
      "保温时间": "...",
      "降温速率": "...",
      "出炉温度": "...",
      "冷却介质": "...",
      "介质温度": "..."
    }}
  ]

  [文档内容]
  {context}

  请直接输出紧凑 JSON 结果（不要包含多余空格、换行或缩进），不要包含任何解释文字。

fields:
  材料牌号:
    description: "文档中出现的材料牌号"
    required: true
  项目大类:
    description: "热处理所属的项目大类（从 features_list 选取）"
    required: true
  工艺名称:
    description: "热处理工艺名称（如 固溶、时效、退火、淬火）"
  工序名称:
    description: "工序名称（如 加热、保温、冷却）"
  装炉温度:
    description: "装炉温度（如 ≤800℃）"
  升温速率:
    description: "升温速率（如 ≤200℃/h）"
  保温温度:
    description: "保温温度（如 1020±10℃）"
  保温时间:
    description: "保温时间（如 ≥2h）"
  降温速率:
    description: "降温速率（如 ≤50℃/h）"
  出炉温度:
    description: "出炉温度（如 ≤500℃）"
  冷却介质:
    description: "冷却介质（如 空气、水、油）"
  介质温度:
    description: "介质温度（如 室温）"
