# 字段描述定义（人工定义，注入 prompt 帮助模型理解抽取目标）
# 供 LangExtract 线路和 glmocr 线路共用
# 每个字段含 description 和可选 enum_source

# 类别列表字段（第二部分）
材料牌号:
  description: "文档中出现的材料牌号，如 06Cr19Ni10、TA15、GH4169"
  required: true

项目名称:
  description: "从{feature}类别的item列表匹配：{items前20个}，按语义匹配非字面匹配"
  enum_source: items  # enum 取自配置中心 term_base 类别展开的 item 列表
  required: true

单位:
  description: "项目的标准单位，如 %、MPa、J、HBW"

标准要求:
  description: "原文中对应项目的限值，保留原始符号（≥/≤/~），如 ≤0.08、≥930"

试验方法:
  description: "从{feature}类别的method列表匹配：{method_codes}，有年代号保留，无年代号取最新"
  enum_source: methods  # enum 取自配置中心 term_base 类别展开的 method 列表

试验温度:
  description: "试验温度，如 室温、20℃、650℃、-196℃。从文档中对应的试验温度列或表头中提取"

位置:
  description: "取样位置，如 1/2R、1/4R、表面、中心"

方向:
  description: "取样方向，如 纵向、横向、轴向"

尺寸厚度:
  description: "试样尺寸或厚度，如 φ10、t=2mm"

试样状态:
  description: "试样状态，如 退火、固溶、淬火+时效"

取样数量:
  description: "取样数量，如 2个、3组"

取样说明:
  description: "取样说明补充信息"

锻件类型:
  description: "锻件类型，如 自由锻、模锻"

# 基础信息字段（第一部分）
标准名称:
  description: "标准的完整名称，如 不锈钢棒"
  required: true

标准编号:
  description: "标准编号，如 GB/T 1220-2007"
  required: true

# 热处理制度字段（第三部分）
工艺名称:
  description: "热处理工艺名称，如 固溶、时效、退火、淬火"

工序名称:
  description: "工序名称，如 加热、保温、冷却"

装炉温度:
  description: "装炉温度，如 ≤800℃"

升温速率:
  description: "升温速率，如 ≤200℃/h"

保温温度:
  description: "保温温度，如 1020±10℃"

保温时间:
  description: "保温时间，如 ≥2h"

降温速率:
  description: "降温速率，如 ≤50℃/h"

出炉温度:
  description: "出炉温度，如 ≤500℃"

冷却介质:
  description: "冷却介质，如 空气、水、油"

介质温度:
  description: "介质温度，如 室温"
