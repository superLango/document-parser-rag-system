# Alembic 配置文件。
# 数据库连接字符串由 alembic/env.py 从应用配置 (settings.DATABASE_URL) 动态读取，
# 此处的 sqlalchemy.url 仅为占位，实际不使用。

[alembic]
# 迁移脚本目录
script_location = alembic

# 将当前目录加入 sys.path，使 env.py 能 import app 包
prepend_sys_path = .

# 迁移文件命名模板：年月日时分-版本号_描述
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# 时区设置为本地时区
timezone = Asia/Shanghai

# sqlalchemy.url 由 env.py 从 settings.DATABASE_URL 动态覆盖
sqlalchemy.url = postgresql+asyncpg://postgres:change_me@localhost:5432/docparser


[post_write_hooks]
# 迁移脚本生成后可选的格式化钩子（可按需启用）
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
