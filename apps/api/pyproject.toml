[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hanson-api"
version = "0.1.0"
description = "Platform API: auth, knowledge bases, documents, tasks, business dictionary"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "sqlalchemy==2.1.6",
  "alembic==1.20.1",
  "PyJWT==2.15.1",
  "bcrypt==5.0.0",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.6",
  "openpyxl==3.1.5",
]

[tool.setuptools.packages.find]
include = ["hanson_api*"]
