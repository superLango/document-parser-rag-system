apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: platform-api
  namespace: metal-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: platform-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: engine-api
  namespace: metal-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: engine-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-api
  namespace: metal-agent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: platform-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: engine-api
  namespace: metal-agent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: engine-api
