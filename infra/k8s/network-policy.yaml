apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: metal-agent
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-and-ingress
  namespace: metal-agent
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-platform-api
  namespace: metal-agent
spec:
  podSelector:
    matchLabels:
      app: platform-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-engine-api
  namespace: metal-agent
spec:
  podSelector:
    matchLabels:
      app: engine-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: platform-api
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-model-plane
  namespace: metal-agent
spec:
  podSelector:
    matchLabels:
      plane: engine
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.188.75/32
    - to:
        - podSelector: {}
    - ports:
        - port: 53
          protocol: UDP
