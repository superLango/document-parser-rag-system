server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 100m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # 允许被其他系统 iframe 嵌入（HANSON_ALLOW_EMBED 的静态侧对应配置）。
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-ancestors *; base-uri 'self'; form-action 'self'" always;

  # SPA routes fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Resolve platform-api per request: after `up -d` recreates the container,
  # nginx would otherwise keep proxying to the old container IP until restart.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Platform API (auth, documents, review). Engine API is internal-only.
  location /v1/ {
    set $platform_api http://platform-api:8000;
    proxy_pass $platform_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    # Feedback repair re-parses the document synchronously (up to ~15 min).
    proxy_read_timeout 900s;
  }

  # hansonDoc_RAG 一站式对接兼容地址（方法/路径保持不变）。
  location /api/v1/integration/ {
    set $platform_api http://platform-api:8000;
    proxy_pass $platform_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
    client_max_body_size 100m;
  }

  location = /healthz {
    return 200 "ok";
    add_header Content-Type text/plain;
  }

  # Engine API is internal-only; never proxy it through the web plane.
  location /engine/ {
    return 404;
  }
}
