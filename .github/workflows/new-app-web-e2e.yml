name: new-app web e2e

on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run Playwright against the compose stack (requires reachable model endpoints)"
        type: boolean
        default: false
  schedule:
    - cron: "0 18 * * 1"

jobs:
  e2e:
    # 定时任务默认运行；手动触发需显式勾选，避免无模型服务时误报。
    if: ${{ github.event_name == 'schedule' || inputs.run_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Boot compose stack
        working-directory: new_app
        run: >-
          docker compose -f deploy/compose/docker-compose.yml
          --project-name hanson-new-app up -d --build

      - name: Wait for gateway and orchestration readiness
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:18000/v1/health >/dev/null \
              && curl -fsS http://localhost:18001/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "stack not ready"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: new_app/web/package-lock.json

      - name: Install web dependencies
        working-directory: new_app/web
        run: npm ci

      - name: Install Playwright chromium
        working-directory: new_app/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: new_app/web
        env:
          API_BASE: http://localhost:18000
          WEB_BASE_URL: http://127.0.0.1:5173
        run: npm run test:e2e

      - name: Dump compose logs
        if: failure()
        working-directory: new_app
        run: >-
          docker compose -f deploy/compose/docker-compose.yml
          --project-name hanson-new-app logs --tail 200

      - name: Stop stack
        if: always()
        working-directory: new_app
        run: >-
          docker compose -f deploy/compose/docker-compose.yml
          --project-name hanson-new-app down -v
