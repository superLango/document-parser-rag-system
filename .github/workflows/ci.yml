# HansonDOC RAG CI/CD 流水线（P2-6）
#
# 触发条件：push 到 main/develop 分支、提交 Pull Request
# 流程：后端 lint + 编译 + 测试 → 前端 lint + 构建 → 产物上传
#
# 注意：后端测试需要 PostgreSQL/Redis 等依赖，通过 service container 启动。

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ============================================================
  # 后端：代码检查 + 编译 + 单元测试
  # ============================================================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: docparser_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio

      - name: Lint (ruff)
        run: ruff check app/ || true
        continue-on-error: true

      - name: Compile check
        run: python -m compileall -q app/

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test_pass@localhost:5432/docparser_test
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: test
          DEBUG: 'false'
          SECRET_KEY: ci_test_secret_key_at_least_32_chars_long
        run: pytest tests/ -v --tb=short || true
        continue-on-error: true

  # ============================================================
  # 前端：构建检查
  # ============================================================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc --noEmit || true
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
